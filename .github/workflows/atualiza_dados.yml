name: Atualiza dados do Observatório

on:
  schedule:
    # dia 5 de cada mês, 09:00 UTC (o BCB publica com ~60 dias de defasagem;
    # o fetch tolera 404 de meses ainda não publicados)
    - cron: "0 9 5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala dependências
        run: pip install -r pipeline/requirements.txt
      - name: Executa pipeline (aborta se ponto de controle falhar)
        run: python3 pipeline/run_all.py
      - name: Commit e push de novos dados
        run: |
          git config user.name "observatorio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "chore(dados): atualização automática dos balancetes BCB"
            git push
          fi
